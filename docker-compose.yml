services:

  mysql:
    image: mysql:8.0
    container_name: superchat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - superchat-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: .docker/Dockerfile
      target: development
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
    container_name: superchat-backend
    volumes:
      - ./backend:/app
    environment:
      PORT: ${BACKEND_PORT:-3000}
      DB_HOST: ${DB_HOST:-superchat-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - superchat-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: .docker/Dockerfile
      target: development
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
    container_name: superchat-frontend
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-/}
    networks:
      - superchat-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: superchat-nginx
    volumes:
      - ./frontend/.docker/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/.docker/ssl:/etc/nginx/ssl:ro
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - superchat-net
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: superchat-pma
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - superchat-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  superchat-net:
    driver: bridge

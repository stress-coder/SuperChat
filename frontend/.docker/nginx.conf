events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile     on;
  gzip         on;
  gzip_types   text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

  # HTTP → HTTPS
  server {
    listen 80;
    server_name superchat.test;
    return 301 https://$host$request_uri;
  }

  # HTTPS — serve React SPA + proxy API/WebSocket to backend
  server {
    listen 443 ssl;
    server_name superchat.test;

    ssl_certificate     /etc/nginx/ssl/superchat.test.crt;
    ssl_certificate_key /etc/nginx/ssl/superchat.test.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html;
    index index.html;

    # React Router — SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Backend REST API (strips /api prefix before forwarding)
    location /api/ {
      proxy_pass         http://backend-superchat:3000/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Socket.io WebSocket
    location /socket.io/ {
      proxy_pass         http://backend-superchat:3000/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
    }
  }
}
